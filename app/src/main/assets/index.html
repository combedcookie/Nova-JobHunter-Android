<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVA Board</title><style>
:root{--paper:#f4eddf;--ink:#211d19;--copper:#865136;--line:#d5c8b7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:25px 19px 19px;position:sticky;top:0;background:var(--paper);z-index:2}.brand{font-size:clamp(24px,6vw,38px);font-weight:bold;letter-spacing:1px}.star{font-size:30px;color:var(--copper)}.menu{font:28px sans-serif;color:var(--copper)}.layout{display:flex;min-height:calc(100dvh - 85px)}aside{width:35%;max-width:190px;border-right:1px solid var(--line);flex-shrink:0}aside button{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:21px 13px;color:var(--ink);font:19px Georgia;cursor:pointer}aside button small{display:block;font:12px system-ui;color:#786f66;margin-top:9px}aside button.active{background:#e9dbc8;border-left:3px solid var(--copper)}main{padding:22px 17px;width:65%;max-width:900px;overflow-wrap:anywhere}h1{font-size:clamp(25px,6vw,39px);margin:0 0 18px}h2{font-size:22px;margin:18px 0 9px}.item{border-top:1px solid var(--line);padding:18px 0}.meta{font:12px system-ui;color:#6c655e;line-height:1.7}.name{font-size:18px;font-weight:bold}.pill{display:inline-block;font:11px system-ui;border:1px solid var(--line);padding:4px 8px;border-radius:30px;margin:5px 4px 4px 0}.action{border:1px solid var(--copper);border-radius:4px;background:var(--copper);color:white;padding:9px 11px;font:13px system-ui;cursor:pointer;margin:5px 5px 0 0}.action.secondary{background:transparent;color:var(--copper)}input,select,textarea{width:100%;border:1px solid var(--line);padding:11px;background:#fffaf1;font:14px system-ui;margin:6px 0 12px}label{font:12px system-ui}.note{font:13px/1.6 system-ui;color:#625a52}.hidden{display:none}@media(max-width:370px){aside{width:32%}main{width:68%;padding:18px 10px}aside button{font-size:16px;padding:17px 8px}}
</style></head><body><header class="top"><span class="star">✦</span><span class="brand">NOVA BOARD</span><span class="menu">☰</span></header><div class="layout"><aside id="nav"></aside><main id="content"></main></div><script>
const tabs=['Overview','Jobs','BugHunter','Applications','Learn'];let tab='Overview';let jobs=[];let saved=JSON.parse(localStorage.getItem('nova.saved')||'[]');let bounties=JSON.parse(localStorage.getItem('nova.bounties')||'[]');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){localStorage.setItem('nova.saved',JSON.stringify(saved));localStorage.setItem('nova.bounties',JSON.stringify(bounties))}
function money(j){if(!j.pay_min&&!j.pay_max)return 'Pay not disclosed';let f=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:j.pay_currency||'USD',maximumFractionDigits:0});return (j.pay_min?f(j.pay_min):'?')+'–'+(j.pay_max?f(j.pay_max):'?')+'/'+(j.pay_period||'year')}
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="show('${t}')">${t}<small>${t==='Jobs'?jobs.length:t==='Applications'?saved.length:t==='BugHunter'?bounties.length:'✧'} </small></button>`).join('')}
function show(t){tab=t;nav();let h='';if(t==='Overview'){h=`<h1>Welcome back.</h1><p class="note">Your private opportunity board. Review positions, save applications and organize bounty research.</p><div class="item"><div class="name">${jobs.length} example jobs</div><div class="meta">Offline demonstration data</div></div><div class="item"><div class="name">${saved.length} tracked applications</div><div class="meta">Saved on this device</div></div><div class="item"><div class="name">${bounties.length} bounty notes</div><div class="meta">Manual research only; verify program scope</div></div>`}
if(t==='Jobs'){h='<h1>Jobs</h1><p class="note">Sample listings from NOVA v0.6. Match scores are illustrative, not live engine results.</p>'+jobs.map((j,i)=>`<article class="item"><div class="name">${esc(j.title)}</div><div class="meta">${esc(j.company)} · ${money(j)}<br>Illustrative match: ${j.score}%</div><p class="note">${esc(j.description)}</p><button class="action" onclick="saveJob(${i})">Track application</button></article>`).join('')}
if(t==='BugHunter'){h=`<h1>BugHunter</h1><p class="note">Keep research notes on publicly listed programs. Confirm authorization and current scope on the official program page before any testing. No scanning runs in this preview.</p><label>Program name</label><input id="bn" placeholder="e.g. Example VDP"><label>Official program URL</label><input id="bu" placeholder="https://..."><button class="action" onclick="addBounty()">Save program</button>`+bounties.map((b,i)=>`<div class="item"><div class="name">${esc(b.name)}</div><div class="meta">${esc(b.url)}</div><span class="pill">Scope unverified</span><button class="action secondary" onclick="removeBounty(${i})">Remove</button></div>`).join('')}
if(t==='Applications'){h='<h1>Applications</h1><p class="note">Status changes are manual. NOVA never assumes an application was submitted.</p>'+saved.map((j,i)=>`<div class="item"><div class="name">${esc(j.title)}</div><div class="meta">${esc(j.company)} · ${esc(j.pay)}<br>Status: ${esc(j.status)}</div><select aria-label="Application status" onchange="changeStatus(${i},this.value)">${['Saved','Prepared','Needs review','Submitted (confirmed)','Interview','Rejected'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select><button class="action secondary" onclick="removeJob(${i})">Remove</button></div>`).join('')+'<p class="note">No recruiter-email synchronization in this preview.</p>'}
if(t==='Learn'){h='<h1>Learn</h1><div class="item"><h2>IT troubleshooting</h2><p class="note">Networking, DNS, VPN fundamentals, help-desk ticket documentation.</p></div><div class="item"><h2>Web security</h2><p class="note">Practice authorization, HTTP and API concepts in purpose-built labs such as PortSwigger Web Security Academy.</p></div><div class="item"><h2>Next integration</h2><p class="note">Connect the v0.6 Python engine through an explicit Android-compatible bridge. It is included as reference source, not executed in this preview.</p></div>'}
document.getElementById('content').innerHTML=h}
function saveJob(i){const j=jobs[i];if(saved.some(x=>x.url===j.url)){alert('Already tracked');return}saved.push({title:j.title,company:j.company,url:j.url,pay:money(j),status:'Saved'});persist();show('Applications')}
function changeStatus(i,s){if(s==='Submitted (confirmed)'&&!confirm('Have you independently confirmed this application was actually submitted?')){show('Applications');return}saved[i].status=s;persist();show('Applications')}
function removeJob(i){saved.splice(i,1);persist();show('Applications')}
function addBounty(){const name=document.getElementById('bn').value.trim(),url=document.getElementById('bu').value.trim();if(!name||!/^https:\/\//.test(url)){alert('Enter a program name and HTTPS URL');return}bounties.push({name,url});persist();show('BugHunter')}
function removeBounty(i){bounties.splice(i,1);persist();show('BugHunter')}
fetch('sample_jobs.json').then(r=>r.json()).then(j=>{jobs=j;show(tab)}).catch(()=>show(tab));
</script></body></html>
