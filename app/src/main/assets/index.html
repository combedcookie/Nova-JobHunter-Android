<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVA JobHunter</title><style>
:root{--paper:#f4eddf;--ink:#211d19;--copper:#865136;--line:#d5c8b7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:17px;position:sticky;top:0;background:var(--paper);z-index:3}.brand{font-size:clamp(23px,6vw,35px);font-weight:bold;letter-spacing:1px}.star{font-size:28px;color:var(--copper)}.menu{font:28px sans-serif;color:var(--copper);background:none;border:0;padding:4px 9px}.layout{display:block}aside{display:none;background:#eee1cf;border-bottom:1px solid var(--line);padding:8px}aside.open{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}aside button{border:1px solid var(--line);background:var(--paper);padding:13px 5px;color:var(--ink);font:17px Georgia}aside button.active{background:#e0c6ab;border-color:var(--copper)}main{padding:20px 17px;max-width:850px;margin:auto}h1{font-size:30px;margin:0 0 15px}h2{font-size:22px}.item{border-top:1px solid var(--line);padding:17px 0}.meta{font:13px/1.6 system-ui;color:#665e56}.name{font-size:19px;font-weight:bold}.pill{display:inline-block;font:11px system-ui;border:1px solid var(--line);padding:4px 8px;border-radius:30px;margin:5px 4px 4px 0}.action{border:1px solid var(--copper);border-radius:4px;background:var(--copper);color:white;padding:11px;font:14px system-ui;margin:6px 6px 0 0}.action.secondary{background:transparent;color:var(--copper)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:12px;background:#fffaf1;font:15px system-ui;margin:5px 0 12px}label{font:13px system-ui}.note{font:14px/1.6 system-ui;color:#625a52}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters>div{min-width:0}.empty{padding:30px 10px;text-align:center;border:1px dashed var(--line)}

.autopilot-row{border-top:1px solid var(--line);padding:14px 0}.autopilot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.autopilot-grid>div{min-width:0}.autopilot-status{display:inline-block;font:12px system-ui;color:var(--copper);border:1px solid var(--line);border-radius:15px;padding:3px 8px}.autopilot-draft{white-space:pre-wrap;font:13px/1.6 system-ui;background:#fffaf1;padding:12px;border:1px solid var(--line);margin:10px 0}.autopilot-controls{display:flex;flex-wrap:wrap;gap:5px}
</style></head><body><header class="top"><span class="star">✦</span><span class="brand">NOVA BOARD</span><button class="menu" onclick="toggleMenu()" aria-label="Toggle menu">☰</button></header><div class="layout"><aside id="nav"></aside><main id="content"></main></div>
<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('content');
  if (el) {
    el.style.cssText = 'padding:20px;color:#9b2226;white-space:pre-wrap';
    el.textContent = 'NOVA STARTUP ERROR:\n' +
      (e.message || 'Unknown error') +
      '\nLine: ' + e.lineno;
  }
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('content');
  if (el) el.textContent = 'NOVA ERROR: ' + String(e.reason);
});
</script>
<script>
const tabs=['Overview','Jobs','Autopilot','BugHunter','Applications','Learn','Audit','Settings'];let tab='Overview',jobs=[],query='',searched=false,loading=false,error='',req=0;let saved=load('nova.saved'),bounties=load('nova.bounties');let provider='remotive',jobLocation='Columbus, OH',configReq=0,providerReq=0,providerPending='',programs=[],providerError='';let auditReq=0,auditHistory=load('nova.auditHistory');let filters={work:'any',type:'any',salary:'0',level:'any'};
function load(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}function persist(){localStorage.setItem('nova.saved',JSON.stringify(saved));localStorage.setItem('nova.bounties',JSON.stringify(bounties))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}function toggleMenu(){document.getElementById('nav').classList.toggle('open')}function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="show('${t}');document.getElementById('nav').classList.remove('open')">${t}</button>`).join('')}
function score(j){let s=25;let text=(j.title+' '+j.description).toLowerCase();for(const k of ['help desk','support','troubleshoot','technical','python','linux','android','security','network','software','qa','junior','entry'])if(text.includes(k))s+=5;return Math.min(95,s)}function pay(j){return j.salary||'Salary not disclosed'}function normalized(j){return {id:String(j.id||j.url),title:j.title||'Untitled',company:j.company_name||'Unknown',location:j.candidate_required_location||'Remote',type:j.job_type||'Not specified',salary:j.salary||'',url:j.url||'',description:(j.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,700),date:j.publication_date||'',remote:true,provider:'remotive'}}
function filtered(){return jobs.filter(j=>{let t=(j.title+' '+j.description).toLowerCase();if(filters.work==='onsite'&&j.remote)return false;if(filters.work==='remote'&&!j.remote)return false;if(filters.type!=='any'&&!j.type.toLowerCase().includes(filters.type))return false;if(filters.level==='entry'&&!/junior|entry|associate|help desk|support|trainee|intern|level 1|tier 1/i.test(j.title))return false;if(+filters.salary>0){let nums=j.salary.match(/[\d,]+/g)||[];let amounts=nums.map(x=>Number(x.replace(/,/g,''))).filter(n=>n>=10000);if(!amounts.length||Math.max(...amounts)<+filters.salary)return false}return true}).sort((a,b)=>score(b)-score(a))}
function jobCard(j,i){return `<article class="item"><div class="name">${esc(j.title)}</div><div class="meta">${esc(j.company)} · ${esc(j.location)}<br>${esc(pay(j))} · ${esc(j.type)}</div><span class="pill">Skill fit estimate: ${score(j)}%</span><span class="pill">${esc(j.provider||'Provider')}</span><p class="note">${esc(j.description.slice(0,280))}${j.description.length>280?'…':''}</p><button class="action" onclick="openJob(${i})">View / Apply</button><button class="action secondary" onclick="saveJob(${i})">Track</button></article>`}
function show(t){tab=t;nav();let h='';if(t==='Overview'){h=`<h1>Welcome back.</h1><p class="note">Your private opportunity board. Search live remote openings, track applications, and organize bounty research.</p><div class="item"><div class="name">${jobs.length} fetched jobs</div><div class="meta">Live search results from Remotive; search required</div></div><div class="item"><div class="name">${saved.length} tracked applications</div><div class="meta">Stored locally on this phone</div></div><div class="item"><div class="name">${bounties.length} bounty notes</div><div class="meta">Manual research; verify authorization</div></div><button class="action" onclick="show('Jobs')">Search jobs</button>`}
if(t==='Jobs'){h=`<h1>Job search</h1><p class="note">Search Remotive, Adzuna, or USAJOBS. Coverage and salary data vary by provider.</p><label>Source</label><select id="provider" onchange="provider=this.value;show('Jobs')"><option value="remotive">Remotive (no key)</option><option value="adzuna">Adzuna (local)</option><option value="usajobs">USAJOBS (federal)</option></select><label>Location (Adzuna / USAJOBS)</label><input id="location" value="${attr(jobLocation)}" placeholder="Columbus, OH"><label>Job title or keyword</label><input id="q" value="${attr(query)}" placeholder="Help desk, junior IT, Python..."><button class="action" onclick="searchJobs()">${loading?'Searching…':'Search live jobs'}</button><div class="filters"><div><label>Work arrangement</label><select id="work" onchange="setFilter('work',this.value)"><option value="any">Any available</option><option value="remote">Remote</option><option value="onsite">On-site (not in this source)</option></select></div><div><label>Employment</label><select id="type" onchange="setFilter('type',this.value)"><option value="any">Any</option><option value="full_time">Full-time</option><option value="part_time">Part-time</option><option value="contract">Contract</option><option value="internship">Internship</option></select></div><div><label>Minimum listed annual pay</label><select id="salary" onchange="setFilter('salary',this.value)"><option value="0">Any / undisclosed</option><option value="40000">$40,000+</option><option value="60000">$60,000+</option><option value="80000">$80,000+</option><option value="100000">$100,000+</option></select></div><div><label>Experience</label><select id="level" onchange="setFilter('level',this.value)"><option value="any">Any</option><option value="entry">Entry-level titles</option></select></div></div><p class="note" id="status">${loading?'Fetching live postings…':error?esc(error):searched?`${filtered().length} matches from ${jobs.length} fetched postings`:'Run a search to begin.'}</p><div id="results">${filtered().map((j)=>jobCard(j,jobs.indexOf(j))).join('')|| (searched&&!loading?'<div class="empty">No matches. Try broader keywords or filters.</div>':'')}</div>`;}

if(t==='Autopilot'){const st=apStats();h=`<h1>NOVA Autopilot</h1><p class="note">Local-first campaign assistant. Searches existing providers, scores jobs, drafts editable materials and queues applications for your review. No automatic submissions.</p><div class="item"><div class="name">${st.ready} awaiting review · ${st.approved} approved · ${st.submitted} confirmed submitted</div><div class="meta">${st.today}/${apSettings.dailyLimit} approved today · ${apQueue.length} total queued · ${st.interviews} interviews</div></div><h2>Campaign settings</h2><div class="autopilot-grid"><div><label>Minimum match score</label><input id="apMin" type="number" min="0" max="100" value="${apSettings.minimumScore}"></div><div><label>Daily approval limit</label><input id="apLimit" type="number" min="1" max="50" value="${apSettings.dailyLimit}"></div></div><label>Job search keyword</label><input id="apQuery" value="${attr(apSettings.keyword)}" placeholder="help desk"><label>Location</label><input id="apLocation" value="${attr(apSettings.location)}" placeholder="Columbus, OH"><label>Job source</label><select id="apProvider"><option value="remotive">Remotive (no key)</option><option value="adzuna">Adzuna (requires key)</option><option value="usajobs">USAJOBS (requires key)</option></select><p><button class="action" onclick="apDiscover()">Discover and score jobs</button><button class="action secondary" onclick="apSaveSettings()">Save settings</button></p><p class="note" id="apMessage">${esc(apMessage)}</p><h2>Verified profile for drafts</h2><p class="note">Enter only skills and experience you can substantiate. No invented qualifications; drafts require review.</p><label>Full name</label><input id="apName" value="${attr(apProfile.name)}" placeholder="Your name"><label>Verified experience and skills</label><textarea id="apExperience" rows="4" placeholder="Describe real experience, skills, and achievements">${esc(apProfile.experience)}</textarea><label>Contact details for draft (optional)</label><input id="apContact" value="${attr(apProfile.contact)}" placeholder="Email / phone"><button class="action secondary" onclick="apSaveProfile()">Save draft profile locally</button><h2>Approval queue</h2>${apQueue.length?apQueue.map((a,i)=>`<div class="autopilot-row"><div class="name">${esc(a.title)}</div><div class="meta">${esc(a.company)} · ${esc(a.location)} · ${esc(a.provider)} · Match ${a.match}%</div><span class="autopilot-status">${esc(a.status)}</span><p class="note">${esc(a.reason)}</p><div class="autopilot-controls"><button class="action secondary" onclick="apDraft(${i})">Draft letter</button><button class="action secondary" onclick="apOpen(${i})">Open posting</button>${a.status==='Review'?`<button class="action" onclick="apApprove(${i})">Approve</button>`:''}${a.status==='Approved'?`<button class="action" onclick="apConfirmSubmitted(${i})">Confirm submitted</button>`:''}${a.status==='Submitted'?`<button class="action" onclick="apInterview(${i})">Mark interview</button>`:''}<button class="action secondary" onclick="apRemove(${i})">Remove</button></div>${apDraftIndex===i?`<div class="autopilot-draft">${esc(apLetter(a))}</div><button class="action secondary" onclick="apCopyDraft(${i})">Copy draft</button>`:''}</div>`).join(''):'<div class="empty">No queued applications yet. Discover jobs to begin.</div>'}`;}
if(t==='BugHunter'){h=`<h1>BugHunter</h1><p class="note">HackerOne program discovery requires configured credentials. Scope and reward eligibility must be checked on the official page.</p><button class="action" onclick="loadPrograms()">Load HackerOne programs</button><p class="note">${esc(providerError)}</p>${programs.map((b,i)=>`<div class="item"><div class="name">${esc(b.name)}</div><button class="action" onclick="Nova.open(programs[${i}].url)">Official program</button></div>`).join('')}<label>Program name</label><input id="bn" placeholder="Program name"><label>Official program URL</label><input id="bu" placeholder="https://..."><button class="action" onclick="addBounty()">Save program</button>`+bounties.map((b,i)=>`<div class="item"><div class="name">${esc(b.name)}</div><div class="meta">${esc(b.url)}</div><button class="action" onclick="openUrl('${encodeURIComponent(b.url)}')">Official scope</button><button class="action secondary" onclick="removeBounty(${i})">Remove</button></div>`).join('')}
if(t==='Applications'){h='<h1>Applications</h1><p class="note">Local tracking only. NOVA never claims an application was submitted automatically.</p>'+saved.map((j,i)=>`<div class="item"><div class="name">${esc(j.title)}</div><div class="meta">${esc(j.company)} · ${esc(j.pay)}<br>Status: ${esc(j.status)}</div><select onchange="changeStatus(${i},this.value)">${['Saved','Prepared','Needs review','Submitted (confirmed)','Interview','Rejected'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select><button class="action" onclick="openSaved(${i})">Open posting</button><button class="action secondary" onclick="removeJob(${i})">Remove</button></div>`).join('')}
if(t==='Settings'){h=`<h1>Settings & API keys</h1><p class="note">Credentials are encrypted using Android Keystore and stored on this phone, not in GitHub. Keys are never shown after saving. Multiple named profiles per provider are supported.</p><label>Provider</label><select id="sp" onchange="settingsFields()"><option value="adzuna">Adzuna</option><option value="usajobs">USAJOBS</option><option value="hackerone">HackerOne</option></select><label>Profile name (letters, numbers, _ or -)</label><input id="sn" value="default" placeholder="default"><div id="fields"></div><button class="action" onclick="saveProfile()">Save / replace profile</button><button class="action secondary" onclick="listProfiles()">Refresh profiles</button><div id="profiles" class="note"></div><p class="note" id="configStatus"></p><h2>Data & privacy</h2><p class="note">Saved jobs and bounty notes remain in app-local WebView storage. API keys use encrypted Android-native storage. Removing app data or uninstalling the app deletes local credentials.</p>`;}
if(t==='Audit'){h=`<h1>Authorized Website Audit</h1><p class="note">Low-impact, single-request security-header review. Only test websites you own or have explicit permission to assess. Does not exploit, crawl, enumerate paths, or confirm vulnerabilities.</p><label>HTTPS website</label><input id="auditTarget" placeholder="https://your-authorized-domain.example"><label><input id="auditConsent" type="checkbox" style="width:auto"> I own this website or have explicit authorization for this check</label><p><button class="action" onclick="runAudit()">Run passive audit</button></p><div class="note" id="auditResult">No audit run yet.</div><h2>Scan history</h2>${auditHistory.map(a=>`<div class="item"><div class="name">${esc(a.host)}</div><div class="meta">${esc(new Date(a.checked_at).toLocaleString())} · HTTP ${esc(a.http_status)}</div>${a.observations.map(x=>`<p class="note">• ${esc(x)}</p>`).join('')}</div>`).join('')}`;}
if(t==='Learn'){h='<h1>Learn</h1><div class="item"><h2>IT troubleshooting</h2><p class="note">Networking, DNS, VPN fundamentals, and help-desk ticket documentation.</p></div><div class="item"><h2>Web security</h2><p class="note">Practice in authorized labs and verify every bug bounty program’s scope.</p></div><div class="item"><h2>About match scores</h2><p class="note">Simple keyword estimates based on technical skills. Not recruiter ratings or guaranteed eligibility.</p></div>'}document.getElementById('content').innerHTML=h;if(t==='Autopilot'){document.getElementById('apProvider').value=apSettings.provider}if(t==='Settings'){settingsFields();listProfiles()}if(t==='Jobs'){document.getElementById('provider').value=provider;for(const k of Object.keys(filters))document.getElementById(k).value=filters[k]}}
function setFilter(k,v){filters[k]=v;show('Jobs')}function searchJobs(){query=document.getElementById('q').value.trim();jobLocation=document.getElementById('location').value.trim()||'Columbus, OH';if(!query){alert('Enter a job title or keyword');return}if(!window.Nova){error='Android network bridge unavailable';show('Jobs');return}loading=true;error='';searched=true;show('Jobs');providerPending=provider;Nova.searchProvider(provider,query,jobLocation,++req)}function novaProviderResult(id,ok,payload){if(id!==req)return;loading=false;try{if(!ok)throw Error(payload);const data=JSON.parse(payload);if(providerPending==='remotive')jobs=(data.jobs||[]).map(normalized);else if(providerPending==='adzuna')jobs=(data.results||[]).map(j=>({id:String(j.id||j.redirect_url),title:j.title||'',company:j.company?.display_name||'Unknown',location:j.location?.display_name||'',type:j.contract_time||'Not specified',salary:j.salary_min||j.salary_max?('$'+Math.round(j.salary_min||0).toLocaleString()+'–$'+Math.round(j.salary_max||0).toLocaleString()+'/yr'):'',url:j.redirect_url||'',description:(j.description||'').replace(/<[^>]*>/g,' ').slice(0,700),remote:/remote/i.test(j.title+' '+(j.description||'')),provider:'Adzuna'}));else if(providerPending==='usajobs')jobs=(data.SearchResult?.SearchResultItems||[]).map(x=>{const j=x.MatchedObjectDescriptor||{};return {id:j.PositionID||'',title:j.PositionTitle||'',company:j.OrganizationName||'',location:j.PositionLocationDisplay||'',type:(j.PositionSchedule||[]).map(a=>a.Name).join(', ')||'Not specified',salary:j.PositionRemuneration?.map(a=>a.MinimumRange+'–'+a.MaximumRange+' '+a.RateIntervalCode).join('; ')||'',url:j.PositionURI||'',description:(j.UserArea?.Details?.JobSummary||'').replace(/<[^>]*>/g,' ').slice(0,700),remote:/remote/i.test(j.PositionLocationDisplay||''),provider:'USAJOBS'}});else if(providerPending==='hackerone'){programs=(data.data||[]).map(x=>({name:x.attributes?.name||x.attributes?.handle||'Program',handle:x.attributes?.handle||'',url:'https://hackerone.com/'+encodeURIComponent(x.attributes?.handle||'')}));providerError='Loaded '+programs.length+' programs';jobs=[];}error='';jobs=jobs.filter(j=>/^https:\/\//.test(j.url));}catch(e){jobs=[];error='Provider error: '+e.message}if(apDiscoveryPending){apDiscoveryPending=false;if(!error)apIngest(jobs);else apMessage=error;show('Autopilot')}else show(providerPending==='hackerone'?'BugHunter':'Jobs')}
function settingsFields(){const p=document.getElementById('sp').value;const f=p==='adzuna'?[['id','App ID'],['key','App Key']]:p==='usajobs'?[['email','Registered email'],['key','API key']]:[['username','Username'],['token','Personal API token']];document.getElementById('fields').innerHTML=f.map(([id,label])=>`<label>${label}</label><input id="f_${id}" ${id==='key'||id==='token'?'type="password"':''} autocomplete="off" placeholder="${label}">`).join('')}
function novaConfigResult(id,ok,payload){if(id!==configReq)return;const e=document.getElementById('configStatus');if(e)e.textContent=(ok?'✓ ':'Error: ')+payload;if(ok&&payload.startsWith('{')){try{const d=JSON.parse(payload),out=document.getElementById('profiles');if(out)out.innerHTML=(d.profiles||[]).map(x=>`<div class="item">${esc(x.provider)} / ${esc(x.name)} ${d['active_'+x.provider]===x.name?'(active)':''} <button class="action secondary" onclick="activateProfile('${x.provider}','${x.name}')">Activate</button><button class="action secondary" onclick="deleteProfile('${x.provider}','${x.name}')">Delete</button></div>`).join('')||'No credentials saved yet.'}catch(e){}}}
function saveProfile(){if(!window.Nova){alert('Android bridge unavailable');return}const p=document.getElementById('sp').value,n=document.getElementById('sn').value.trim();if(!/^[a-zA-Z0-9_-]{1,32}$/.test(n)){alert('Invalid profile name');return}const obj={};document.querySelectorAll('#fields input').forEach(x=>obj[x.id.slice(2)]=x.value.trim());if(Object.values(obj).some(v=>!v)){alert('Fill in all fields');return}Nova.saveProfile(p,n,JSON.stringify(obj),++configReq);document.querySelectorAll('#fields input').forEach(x=>x.value='')}
function listProfiles(){if(!window.Nova){const e=document.getElementById('configStatus');if(e)e.textContent='Android bridge unavailable';return}Nova.listProfiles(++configReq)}function activateProfile(p,n){if(!window.Nova)return;Nova.activateProfile(p,n,++configReq)}function deleteProfile(p,n){if(!window.Nova)return;if(confirm('Delete this credential profile?'))Nova.deleteProfile(p,n,++configReq)}
function loadPrograms(){if(!window.Nova){providerError='Android network bridge unavailable';show('BugHunter');return}providerPending='hackerone';providerError='Loading programs…';show('BugHunter');Nova.searchProvider('hackerone','','',++req)}
function openUrl(encoded){const u=decodeURIComponent(encoded);if(window.Nova&&/^https:\/\//.test(u))Nova.open(u)}function openJob(i){if(window.Nova&&jobs[i]&&/^https:\/\//.test(jobs[i].url))Nova.open(jobs[i].url)}function saveJob(i){const j=jobs[i];if(saved.some(x=>x.url===j.url)){alert('Already tracked');return}saved.push({title:j.title,company:j.company,url:j.url,pay:pay(j),status:'Saved'});persist();show('Applications')}function openSaved(i){if(window.Nova&&saved[i]&&/^https:\/\//.test(saved[i].url))Nova.open(saved[i].url)}function changeStatus(i,s){if(s==='Submitted (confirmed)'&&!confirm('Did you independently confirm this application was submitted?')){show('Applications');return}saved[i].status=s;persist();show('Applications')}function removeJob(i){saved.splice(i,1);persist();show('Applications')}function addBounty(){const name=document.getElementById('bn').value.trim(),url=document.getElementById('bu').value.trim();if(!name||!/^https:\/\//.test(url)){alert('Enter a name and HTTPS URL');return}bounties.push({name,url});persist();show('BugHunter')}function removeBounty(i){bounties.splice(i,1);persist();show('BugHunter')}function runAudit(){if(!window.Nova){alert('Android bridge unavailable');return}const u=document.getElementById('auditTarget').value.trim(),yes=document.getElementById('auditConsent').checked;if(!yes){alert('Explicit authorization required');return}if(!/^https:\/\/[^/]+/.test(u)){alert('Enter a valid HTTPS URL');return}document.getElementById('auditResult').textContent='Checking…';Nova.auditWebsite(u,yes,++auditReq)}
function novaAuditResult(id,ok,payload){if(id!==auditReq)return;const e=document.getElementById('auditResult');if(!ok){if(e)e.textContent='Audit error: '+payload;return}try{const a=JSON.parse(payload);auditHistory.unshift(a);auditHistory=auditHistory.slice(0,30);localStorage.setItem('nova.auditHistory',JSON.stringify(auditHistory));show('Audit');const r=document.getElementById('auditResult');if(r)r.textContent='Audit complete. Observations are not confirmed vulnerabilities.'}catch(ex){if(e)e.textContent='Invalid audit response'}}

// NOVA_AUTOPILOT_MVP_V1: no automatic application submission or unattended background work.
function apRead(k,fallback){try{const v=JSON.parse(localStorage.getItem(k));return v===null?fallback:v}catch(e){return fallback}}
function apWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){apMessage='Could not save locally: '+e.message;return false}}
let apSettings=Object.assign({minimumScore:80,dailyLimit:10,keyword:'help desk',location:'Columbus, OH',provider:'remotive'},apRead('nova.ap.settings',{}));
let apProfile=Object.assign({name:'',experience:'',contact:''},apRead('nova.ap.profile',{}));
let apQueue=apRead('nova.ap.queue',[]);if(!Array.isArray(apQueue))apQueue=[];
let apMessage='Ready to discover jobs.',apDiscoveryPending=false,apDraftIndex=-1;
function apDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function apStats(){return {ready:apQueue.filter(x=>x.status==='Review').length,approved:apQueue.filter(x=>x.status==='Approved').length,submitted:apQueue.filter(x=>x.status==='Submitted'||x.status==='Interview').length,interviews:apQueue.filter(x=>x.status==='Interview').length,today:apQueue.filter(x=>x.approvedDate===apDate()).length}}
function apSaveSettings(){const n=Number(document.getElementById('apMin').value),limit=Number(document.getElementById('apLimit').value);if(!Number.isInteger(n)||n<0||n>100||!Number.isInteger(limit)||limit<1||limit>50){alert('Enter a score from 0 to 100 and daily limit from 1 to 50');return false}apSettings.minimumScore=n;apSettings.dailyLimit=limit;apSettings.keyword=document.getElementById('apQuery').value.trim();apSettings.location=document.getElementById('apLocation').value.trim()||'Columbus, OH';apSettings.provider=document.getElementById('apProvider').value;apWrite('nova.ap.settings',apSettings);apMessage='Campaign settings saved';show('Autopilot');return true}
function apSaveProfile(){apProfile={name:document.getElementById('apName').value.trim(),experience:document.getElementById('apExperience').value.trim(),contact:document.getElementById('apContact').value.trim()};apWrite('nova.ap.profile',apProfile);apMessage='Draft profile saved locally';show('Autopilot')}
function apMatch(j){const s=(j.title+' '+j.description).toLowerCase();let n=35;const terms=['help desk','it support','technical support','desktop support','service desk','troubleshoot','network','windows','linux','android','python','software','qa','junior','entry'];for(const x of terms)if(s.includes(x))n+=5;return Math.min(95,n)}
function apReason(j){const t=(j.title+' '+j.description).toLowerCase();const hits=['help desk','support','troubleshoot','network','linux','android','python','software','qa','junior','entry'].filter(x=>t.includes(x));return hits.length?'Keyword overlap: '+hits.slice(0,5).join(', '):'Low keyword overlap; inspect requirements manually'}
function apIngest(items){let added=0;for(const j of items){const match=apMatch(j);if(match<apSettings.minimumScore||!/^https:\/\//.test(j.url||''))continue;const key=(j.url||'').split('#')[0].replace(/\/$/,'').toLowerCase();if(apQueue.some(x=>x.key===key))continue;apQueue.push({key,url:j.url,title:j.title||'Untitled',company:j.company||'Unknown',location:j.location||'Unspecified',provider:j.provider||apSettings.provider,match,reason:apReason(j),status:'Review',createdAt:new Date().toISOString(),approvedDate:''});added++}apWrite('nova.ap.queue',apQueue);apMessage='Scanned '+items.length+' results; added '+added+' new matches at or above '+apSettings.minimumScore+'%. Match score is a heuristic, not a recruiter assessment.'}
function apDiscover(){if(!apSaveSettings())return;if(!apSettings.keyword){alert('Enter a search keyword');return}if(!window.Nova){apMessage='Android job search bridge unavailable';show('Autopilot');return}apDiscoveryPending=true;apMessage='Searching '+apSettings.provider+'…';show('Autopilot');providerPending=apSettings.provider;Nova.searchProvider(apSettings.provider,apSettings.keyword,apSettings.location,++req)}
function apLetter(a){return 'APPLICATION DRAFT — REVIEW BEFORE SENDING\n\n'+(apProfile.name||'[Your name]')+'\n'+(apProfile.contact||'[Your contact details]')+'\n\nDear Hiring Team,\n\nI am interested in the '+a.title+' position at '+a.company+'.\n\n'+(apProfile.experience?'My relevant background includes: '+apProfile.experience:'[Add your verified relevant experience and specific accomplishments here.]')+'\n\nI would welcome the opportunity to discuss how my experience aligns with this role. Thank you for your consideration.\n\nSincerely,\n'+(apProfile.name||'[Your name]')}
function apDraft(i){apDraftIndex=apDraftIndex===i?-1:i;show('Autopilot')}
function apCopyDraft(i){const s=apLetter(apQueue[i]);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>alert('Draft copied')).catch(()=>alert('Clipboard unavailable; select text manually'))}else alert('Select the draft text and copy manually')}
function apOpen(i){const a=apQueue[i];if(a&&window.Nova&&/^https:\/\//.test(a.url))Nova.open(a.url)}
function apApprove(i){const a=apQueue[i];if(!a||a.status!=='Review')return;if(apStats().today>=apSettings.dailyLimit){alert('Daily approval limit reached');return}if(!confirm('Approve this application for manual submission? NOVA will not submit it automatically.'))return;a.status='Approved';a.approvedDate=apDate();apWrite('nova.ap.queue',apQueue);show('Autopilot')}
function apConfirmSubmitted(i){const a=apQueue[i];if(!a||a.status!=='Approved')return;if(!confirm('Have you completed the application on the employer website and received confirmation?'))return;a.status='Submitted';a.submittedAt=new Date().toISOString();apWrite('nova.ap.queue',apQueue);show('Autopilot')}
function apInterview(i){const a=apQueue[i];if(!a||a.status!=='Submitted')return;a.status='Interview';apWrite('nova.ap.queue',apQueue);show('Autopilot')}
function apRemove(i){if(!apQueue[i]||!confirm('Remove this application from the queue?'))return;apQueue.splice(i,1);apDraftIndex=-1;apWrite('nova.ap.queue',apQueue);show('Autopilot')}

try{show('Overview')}catch(e){document.getElementById('content').textContent='NOVA could not start. Please report this startup error (no personal data): '+(e&&e.name||'Unknown error')}
</script></body></html>
