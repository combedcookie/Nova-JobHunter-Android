<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOVA JobHunter</title><style>
:root{--paper:#f4eddf;--ink:#211d19;--copper:#865136;--line:#d5c8b7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:17px;position:sticky;top:0;background:var(--paper);z-index:3}.brand{font-size:clamp(23px,6vw,35px);font-weight:bold;letter-spacing:1px}.star{font-size:28px;color:var(--copper)}.menu{font:28px sans-serif;color:var(--copper);background:none;border:0;padding:4px 9px}.layout{display:block}aside{display:none;background:#eee1cf;border-bottom:1px solid var(--line);padding:8px}aside.open{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}aside button{border:1px solid var(--line);background:var(--paper);padding:13px 5px;color:var(--ink);font:17px Georgia}aside button.active{background:#e0c6ab;border-color:var(--copper)}main{padding:20px 17px;max-width:850px;margin:auto}h1{font-size:30px;margin:0 0 15px}h2{font-size:22px}.item{border-top:1px solid var(--line);padding:17px 0}.meta{font:13px/1.6 system-ui;color:#665e56}.name{font-size:19px;font-weight:bold}.pill{display:inline-block;font:11px system-ui;border:1px solid var(--line);padding:4px 8px;border-radius:30px;margin:5px 4px 4px 0}.action{border:1px solid var(--copper);border-radius:4px;background:var(--copper);color:white;padding:11px;font:14px system-ui;margin:6px 6px 0 0}.action.secondary{background:transparent;color:var(--copper)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:12px;background:#fffaf1;font:15px system-ui;margin:5px 0 12px}label{font:13px system-ui}.note{font:14px/1.6 system-ui;color:#625a52}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters>div{min-width:0}.empty{padding:30px 10px;text-align:center;border:1px dashed var(--line)}
</style></head><body><header class="top"><span class="star">✦</span><span class="brand">NOVA BOARD</span><button class="menu" onclick="toggleMenu()" aria-label="Toggle menu">☰</button></header><div class="layout"><aside id="nav"></aside><main id="content"></main></div><script>
const tabs=['Overview','Jobs','BugHunter','Applications','Learn'];let tab='Overview',jobs=[],query='',searched=false,loading=false,error='',req=0;let saved=load('nova.saved'),bounties=load('nova.bounties');let filters={work:'any',type:'any',salary:'0',level:'any'};
function load(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}function persist(){localStorage.setItem('nova.saved',JSON.stringify(saved));localStorage.setItem('nova.bounties',JSON.stringify(bounties))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}function toggleMenu(){document.getElementById('nav').classList.toggle('open')}function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="show('${t}');document.getElementById('nav').classList.remove('open')">${t}</button>`).join('')}
function score(j){let s=25;let text=(j.title+' '+j.description).toLowerCase();for(const k of ['help desk','support','troubleshoot','technical','python','linux','android','security','network','software','qa','junior','entry'])if(text.includes(k))s+=5;return Math.min(95,s)}function pay(j){return j.salary||'Salary not disclosed'}function normalized(j){return {id:String(j.id||j.url),title:j.title||'Untitled',company:j.company_name||'Unknown',location:j.candidate_required_location||'Remote',type:j.job_type||'Not specified',salary:j.salary||'',url:j.url||'',description:(j.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,700),date:j.publication_date||'',remote:true}}
function filtered(){return jobs.filter(j=>{let t=(j.title+' '+j.description).toLowerCase();if(filters.work==='onsite')return false;if(filters.type!=='any'&&!j.type.toLowerCase().includes(filters.type))return false;if(filters.level==='entry'&&!/junior|entry|associate|help desk|support|trainee|intern|level 1|tier 1/i.test(j.title))return false;if(+filters.salary>0){let nums=j.salary.match(/[\d,]+/g)||[];let amounts=nums.map(x=>Number(x.replace(/,/g,''))).filter(n=>n>=10000);if(!amounts.length||Math.max(...amounts)<+filters.salary)return false}return true}).sort((a,b)=>score(b)-score(a))}
function jobCard(j,i){return `<article class="item"><div class="name">${esc(j.title)}</div><div class="meta">${esc(j.company)} · ${esc(j.location)}<br>${esc(pay(j))} · ${esc(j.type)}</div><span class="pill">Skill fit estimate: ${score(j)}%</span><span class="pill">Remote provider</span><p class="note">${esc(j.description.slice(0,280))}${j.description.length>280?'…':''}</p><button class="action" onclick="openJob(${i})">View / Apply</button><button class="action secondary" onclick="saveJob(${i})">Track</button></article>`}
function show(t){tab=t;nav();let h='';if(t==='Overview'){h=`<h1>Welcome back.</h1><p class="note">Your private opportunity board. Search live remote openings, track applications, and organize bounty research.</p><div class="item"><div class="name">${jobs.length} fetched jobs</div><div class="meta">Live search results from Remotive; search required</div></div><div class="item"><div class="name">${saved.length} tracked applications</div><div class="meta">Stored locally on this phone</div></div><div class="item"><div class="name">${bounties.length} bounty notes</div><div class="meta">Manual research; verify authorization</div></div><button class="action" onclick="show('Jobs')">Search jobs</button>`}
if(t==='Jobs'){h=`<h1>Job search</h1><p class="note">Live remote postings from Remotive. Enter a title or skill. Results depend on provider coverage, not all job boards.</p><label>Job title or keyword</label><input id="q" value="${attr(query)}" placeholder="Help desk, junior IT, Python..."><button class="action" onclick="searchJobs()">${loading?'Searching…':'Search live jobs'}</button><div class="filters"><div><label>Work arrangement</label><select id="work" onchange="setFilter('work',this.value)"><option value="any">Any available</option><option value="remote">Remote</option><option value="onsite">On-site (not in this source)</option></select></div><div><label>Employment</label><select id="type" onchange="setFilter('type',this.value)"><option value="any">Any</option><option value="full_time">Full-time</option><option value="part_time">Part-time</option><option value="contract">Contract</option><option value="internship">Internship</option></select></div><div><label>Minimum listed annual pay</label><select id="salary" onchange="setFilter('salary',this.value)"><option value="0">Any / undisclosed</option><option value="40000">$40,000+</option><option value="60000">$60,000+</option><option value="80000">$80,000+</option><option value="100000">$100,000+</option></select></div><div><label>Experience</label><select id="level" onchange="setFilter('level',this.value)"><option value="any">Any</option><option value="entry">Entry-level titles</option></select></div></div><p class="note" id="status">${loading?'Fetching live postings…':error?esc(error):searched?`${filtered().length} matches from ${jobs.length} fetched postings`:'Run a search to begin.'}</p><div id="results">${filtered().map((j)=>jobCard(j,jobs.indexOf(j))).join('')|| (searched&&!loading?'<div class="empty">No matches. Try broader keywords or filters.</div>':'')}</div>`;}
if(t==='BugHunter'){h=`<h1>BugHunter</h1><p class="note">Local research tracker. Program discovery and reward verification are not yet automated. Only test explicitly authorized targets.</p><label>Program name</label><input id="bn" placeholder="Program name"><label>Official program URL</label><input id="bu" placeholder="https://..."><button class="action" onclick="addBounty()">Save program</button>`+bounties.map((b,i)=>`<div class="item"><div class="name">${esc(b.name)}</div><div class="meta">${esc(b.url)}</div><button class="action" onclick="openUrl('${encodeURIComponent(b.url)}')">Official scope</button><button class="action secondary" onclick="removeBounty(${i})">Remove</button></div>`).join('')}
if(t==='Applications'){h='<h1>Applications</h1><p class="note">Local tracking only. NOVA never claims an application was submitted automatically.</p>'+saved.map((j,i)=>`<div class="item"><div class="name">${esc(j.title)}</div><div class="meta">${esc(j.company)} · ${esc(j.pay)}<br>Status: ${esc(j.status)}</div><select onchange="changeStatus(${i},this.value)">${['Saved','Prepared','Needs review','Submitted (confirmed)','Interview','Rejected'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select><button class="action" onclick="openSaved(${i})">Open posting</button><button class="action secondary" onclick="removeJob(${i})">Remove</button></div>`).join('')}
if(t==='Learn'){h='<h1>Learn</h1><div class="item"><h2>IT troubleshooting</h2><p class="note">Networking, DNS, VPN fundamentals, and help-desk ticket documentation.</p></div><div class="item"><h2>Web security</h2><p class="note">Practice in authorized labs and verify every bug bounty program’s scope.</p></div><div class="item"><h2>About match scores</h2><p class="note">Simple keyword estimates based on technical skills. Not recruiter ratings or guaranteed eligibility.</p></div>'}document.getElementById('content').innerHTML=h;if(t==='Jobs'){for(const k of Object.keys(filters))document.getElementById(k).value=filters[k]}}
function setFilter(k,v){filters[k]=v;show('Jobs')}function searchJobs(){query=document.getElementById('q').value.trim();if(!query){alert('Enter a job title or keyword');return}if(!window.Nova){error='Android network bridge unavailable';show('Jobs');return}loading=true;error='';searched=true;show('Jobs');Nova.search(query,++req)}function novaResult(id,ok,payload){if(id!==req)return;loading=false;try{if(!ok)throw Error(payload);const data=JSON.parse(payload);jobs=(data.jobs||[]).map(normalized).filter(j=>j.url.startsWith('https://'));error=''}catch(e){jobs=[];error='Could not load jobs: '+e.message}if(tab==='Jobs')show('Jobs')}
function openUrl(encoded){const u=decodeURIComponent(encoded);if(/^https:\/\//.test(u))Nova.open(u)}function openJob(i){Nova.open(jobs[i].url)}function saveJob(i){const j=jobs[i];if(saved.some(x=>x.url===j.url)){alert('Already tracked');return}saved.push({title:j.title,company:j.company,url:j.url,pay:pay(j),status:'Saved'});persist();show('Applications')}function openSaved(i){if(saved[i].url)Nova.open(saved[i].url)}function changeStatus(i,s){if(s==='Submitted (confirmed)'&&!confirm('Did you independently confirm this application was submitted?')){show('Applications');return}saved[i].status=s;persist();show('Applications')}function removeJob(i){saved.splice(i,1);persist();show('Applications')}function addBounty(){const name=document.getElementById('bn').value.trim(),url=document.getElementById('bu').value.trim();if(!name||!/^https:\/\//.test(url)){alert('Enter a name and HTTPS URL');return}bounties.push({name,url});persist();show('BugHunter')}function removeBounty(i){bounties.splice(i,1);persist();show('BugHunter')}show('Overview');
</script></body></html>
