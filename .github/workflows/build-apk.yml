name: Build NOVA APK
on:
  workflow_dispatch:
  push:
    branches: [main, release/nova-0.8-preview]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo 'Android SDK command-line tools are missing' >&2
            exit 1
          fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test dashboard
        run: node --test test.cjs test-interactions.cjs test-ai-pipeline.cjs test-bounty-approval.cjs test-release-guards.cjs
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing NOVA signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
          chmod 600 "$RUNNER_TEMP/nova-release.jks"
      - name: Compile debug APK (native and Java validation)
        run: gradle --no-daemon :app:assembleDebug
      - name: Compile signed release APK
        env:
          NOVA_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.jks
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Board-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
